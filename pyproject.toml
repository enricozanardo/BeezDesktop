# BeezDesktop - Native Desktop Application
# Using BeeWare (Toga + Briefcase) for cross-platform GUI

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beezdesktop"
version = "0.6.4"
description = "Beez Desktop Client"
requires-python = ">=3.11"
dependencies = [
    "toga>=0.4.0",
    "cryptography>=42.0.0",
    "ecdsa>=0.18.0",
    "mnemonic>=0.20",
    "base58>=2.1.1",
    "pyzmq>=25.1.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "fastembed>=0.7.0",
    "numpy>=1.26.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "toga-core>=0.4.0",
    "toga-dummy>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Briefcase configuration (for packaging)
[tool.briefcase]
project_name = "BeezDesktop"
bundle = "io.beez"
version = "0.6.4"
url = "https://beez.io"
license.file = "LICENSE"
author = "Enrico Zanardo"
author_email = "ezanardo@stellab.it"

[tool.briefcase.app.beezdesktop]
formal_name = "Beez Desktop"
description = "Desktop client for the Beez Network"
long_description = """
BeezDesktop is the native desktop application for interacting with the Beez Network.
It provides wallet management, file upload/download, transaction handling,
and blockchain exploration - all in a native GUI without requiring a web browser.
"""
icon = "src/beezdesktop/resources/beezdesktop"
sources = ["src/beezdesktop", "shared"]
requires = [
    "toga>=0.4.0",
    "cryptography>=42.0.0",
    "ecdsa>=0.18.0",
    "mnemonic>=0.20",
    "base58>=2.1.1",
    "pyzmq>=25.1.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "fastembed>=0.7.0",
    "numpy>=1.26.0",
    "pymupdf>=1.24.0",
]

# Linux-specific configuration
[tool.briefcase.app.beezdesktop.linux]
system_requires = [
    "libgirepository1.0-dev",
    "libcairo2-dev",
    "libpango1.0-dev",
    "libwebkit2gtk-4.1-dev",
    "gir1.2-webkit2-4.1",
]

# macOS-specific configuration
[tool.briefcase.app.beezdesktop.macOS]
universal_build = true
min_os_version = "11.0"

# Code signing + notarization for macOS are wired in
# .github/workflows/build.yml (build-macos job). They are
# OPT-IN at CI time: the workflow signs only when the
# APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD secrets
# are present in the repo, otherwise it falls back to
# `briefcase package macOS --adhoc-sign` (development build,
# Gatekeeper-blocked on other machines).
#
# Required GitHub secrets for a signed + notarized build:
#   APPLE_CERTIFICATE          -- base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD -- export password used when creating the .p12
#   APPLE_SIGNING_IDENTITY     -- e.g. "Developer ID Application: Enrico Zanardo (3W276Y84C2)"
#   APPLE_TEAM_ID              -- "3W276Y84C2"
#   APPLE_API_KEY_ID           -- App Store Connect API Key ID
#   APPLE_API_ISSUER           -- App Store Connect API Issuer (UUID)
#   APPLE_API_KEY_BASE64       -- base64 of the AuthKey_XXXX.p8 file
#
# See docs/MACOS_SIGNING.md for end-to-end setup + rotation steps.

# Windows-specific configuration
[tool.briefcase.app.beezdesktop.windows]
use_full_install_path = false

# -- Code Signing (requires a code signing certificate) --
# Purchase from DigiCert, Sectigo, or SSL.com (~$200-400/yr for OV, ~$400-600/yr for EV)
# EV certificates automatically bypass SmartScreen warnings.
# OV certificates build trust over time with SmartScreen.
# Install the certificate and uncomment:
#
# signing_identity = "Enrico Zanardo"

# Development dependencies
[tool.briefcase.app.beezdesktop.dev]
requires = [
    "pytest",
    "pytest-asyncio",
]
