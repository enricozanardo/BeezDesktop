# BeezDesktop - Native Desktop Application
# Using BeeWare (Toga + Briefcase) for cross-platform GUI

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beezdesktop"
version = "0.3.9"
description = "Beez Desktop Client"
requires-python = ">=3.11"
dependencies = [
    "toga>=0.4.0",
    "cryptography>=42.0.0",
    "ecdsa>=0.18.0",
    "mnemonic>=0.20",
    "base58>=2.1.1",
    "pyzmq>=25.1.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "fastembed>=0.7.0",
    "numpy>=1.26.0",
    "pymupdf>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Briefcase configuration (for packaging)
[tool.briefcase]
project_name = "BeezDesktop"
bundle = "io.beez"
version = "0.3.8"
url = "https://beez.io"
license.file = "LICENSE"
author = "Enrico Zanardo"
author_email = "ezanardo@stellab.it"

[tool.briefcase.app.beezdesktop]
formal_name = "Beez Desktop"
description = "Desktop client for the Beez Network"
long_description = """
BeezDesktop is the native desktop application for interacting with the Beez Network.
It provides wallet management, file upload/download, transaction handling,
and blockchain exploration - all in a native GUI without requiring a web browser.
"""
icon = "src/beezdesktop/resources/beezdesktop"
sources = ["src/beezdesktop", "shared"]
requires = [
    "toga>=0.4.0",
    "cryptography>=42.0.0",
    "ecdsa>=0.18.0",
    "mnemonic>=0.20",
    "base58>=2.1.1",
    "pyzmq>=25.1.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "fastembed>=0.7.0",
    "numpy>=1.26.0",
    "pymupdf>=1.24.0",
]

# Linux-specific configuration
[tool.briefcase.app.beezdesktop.linux]
system_requires = [
    "libgirepository1.0-dev",
    "libcairo2-dev",
    "libpango1.0-dev",
    "libwebkit2gtk-4.1-dev",
    "gir1.2-webkit2-4.1",
]

# macOS-specific configuration
[tool.briefcase.app.beezdesktop.macOS]
universal_build = true

# -- Code Signing & Notarization (requires Apple Developer Program, $99/yr) --
# 1. Enroll at https://developer.apple.com/programs
# 2. Create a "Developer ID Application" certificate in the Apple Developer portal
# 3. Install the certificate in your macOS Keychain
# 4. Uncomment and set the signing_identity below (find it with: security find-identity -v -p codesigning)
# 5. For notarization, create an App Store Connect API key at:
#    https://appstoreconnect.apple.com/access/api
#    Then set these environment variables before running `briefcase package`:
#      export BRIEFCASE_MACOS_NOTARIZE_ISSUER_ID="your-issuer-uuid"
#      export BRIEFCASE_MACOS_NOTARIZE_KEY_ID="your-key-id"
#      export BRIEFCASE_MACOS_NOTARIZE_KEY_FILE="/path/to/AuthKey_XXXX.p8"
#
# signing_identity = "Developer ID Application: Enrico Zanardo (TEAM_ID)"
# notarize_app = true

# Windows-specific configuration
[tool.briefcase.app.beezdesktop.windows]
use_full_install_path = false

# -- Code Signing (requires a code signing certificate) --
# Purchase from DigiCert, Sectigo, or SSL.com (~$200-400/yr for OV, ~$400-600/yr for EV)
# EV certificates automatically bypass SmartScreen warnings.
# OV certificates build trust over time with SmartScreen.
# Install the certificate and uncomment:
#
# signing_identity = "Enrico Zanardo"

# Development dependencies
[tool.briefcase.app.beezdesktop.dev]
requires = [
    "pytest",
    "pytest-asyncio",
]
