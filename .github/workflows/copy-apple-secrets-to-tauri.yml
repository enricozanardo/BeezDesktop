name: Copy Apple secrets to Tauri

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy signing secrets to BeezDesktop-tauri
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          DEST=enricozanardo/BeezDesktop-tauri
          gh secret set APPLE_CERTIFICATE --repo "$DEST" --body "$APPLE_CERTIFICATE"
          gh secret set APPLE_CERTIFICATE_PASSWORD --repo "$DEST" --body "$APPLE_CERTIFICATE_PASSWORD"
          gh secret set APPLE_SIGNING_IDENTITY --repo "$DEST" --body "$APPLE_SIGNING_IDENTITY"
          gh secret set APPLE_TEAM_ID --repo "$DEST" --body "$APPLE_TEAM_ID"
          gh secret set APPLE_API_KEY_ID --repo "$DEST" --body "$APPLE_API_KEY_ID"
          gh secret set APPLE_API_ISSUER --repo "$DEST" --body "$APPLE_API_ISSUER"
          gh secret set APPLE_API_KEY_BASE64 --repo "$DEST" --body "$APPLE_API_KEY_BASE64"
          echo "Copied 7 Apple secrets to $DEST"
          gh secret list --repo "$DEST"
