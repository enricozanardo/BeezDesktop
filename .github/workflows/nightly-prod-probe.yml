name: nightly-prod-probe
# Nightly + on-demand probe of the production Beez network.
# Catches the "Smart/Knowledge dead" regression (audit D-04, D-05),
# the chain consensus collapse (A-07), and the public Postgres health
# regression (Phase 7-G4 / B-12) before users do.
#
# Hits live prod IPs read-only. No state-changing transactions are sent.

on:
  schedule:
    - cron: "17 3 1 * *"  # 03:17 UTC daily, off the cluster's hot hour
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run prod probe
        id: probe
        run: |
          mkdir -p reports
          python scripts/prod_probe.py --out-dir reports/run_${GITHUB_RUN_ID}

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-probe-${{ github.run_id }}
          path: reports/run_${{ github.run_id }}/
          retention-days: 30

      - name: Open issue on regression
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `reports/run_${process.env.GITHUB_RUN_ID}/summary.md`;
            let body = "Nightly prod probe failed; see workflow logs.";
            try { body = fs.readFileSync(path, "utf8"); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[nightly-prod-probe] ${new Date().toISOString().slice(0,10)} regression`,
              body: body.slice(0, 60000),
              labels: ["regression", "production"],
            });
