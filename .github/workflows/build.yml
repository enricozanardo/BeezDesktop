name: Build Desktop Apps

on:
  push:
    branches: [ez_dev, main]
    tags: ["v*"]
  pull_request:
    branches: [ez_dev, main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Syncing version to $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" src/beezdesktop/__init__.py

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-venv \
            libgirepository1.0-dev \
            libgirepository-2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libwebkit2gtk-4.1-dev \
            gir1.2-webkit2-4.1

      - name: Install Briefcase
        run: python3 -m pip install --break-system-packages briefcase

      - name: Build Linux app
        run: |
          briefcase create linux
          briefcase build linux
          briefcase package linux --adhoc-sign

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeezDesktop-linux
          path: dist/*
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Syncing version to $VERSION"
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i '' "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" src/beezdesktop/__init__.py

      - name: Install Briefcase
        run: pip install briefcase

      - name: Build macOS app
        run: |
          briefcase create macOS
          briefcase build macOS
          briefcase package macOS --adhoc-sign

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeezDesktop-macOS
          path: dist/*
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV
          Write-Host "Syncing version to $VERSION"
          (Get-Content pyproject.toml) -replace '^version = ".*"', "version = `"$VERSION`"" | Set-Content pyproject.toml
          (Get-Content src/beezdesktop/__init__.py) -replace '^__version__ = ".*"', "__version__ = `"$VERSION`"" | Set-Content src/beezdesktop/__init__.py

      - name: Install Briefcase
        run: pip install briefcase

      - name: Build Windows app
        run: |
          briefcase create windows
          briefcase build windows
          briefcase package windows --adhoc-sign

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeezDesktop-windows
          path: dist/*
          if-no-files-found: warn

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Beez Desktop v${{ env.VERSION }}"
          files: dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
